[package]
name = "trunk-caster"
version = "0.1.0"
edition = "2021"
description = "Protocol-first intercom trunk broker runtime. Speaks by protocol, not by brand."

[[bin]]
name = "trunk-caster"
path = "src/main.rs"

[dependencies]
trunk-caster-sdk = { path = "../TRUNK-CASTER-SDK" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
