# The MQTT broker between the caster and the simulators: the transport that
# runs in parallel with the Ward-Beck port. Every line travels both ways and
# a simulator applies it only when the two copies agree.
#
#   trunk-caster/<protocol>/<frame>/line     caster -> frame
#   trunk-caster/<protocol>/<frame>/ack      frame -> caster, applied after double validation
#   trunk-caster/<protocol>/<frame>/reject   frame -> caster, "<reason>|<line>"
#   trunk-caster/<protocol>/<frame>/voice1   frame -> caster, the frame's voice in 1-second chunks
#   trunk-caster/<protocol>/<frame>/voice5   frame -> caster, the same voice in 5-second chunks
#                                            (sent at the same time; see plans/11-taps-voices-bandwidth.md)
#
# Watch it:  docker exec trunk-mqtt mosquitto_sub -v -t 'trunk-caster/#'
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
