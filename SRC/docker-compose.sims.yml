# Generated by `trunk-caster compose`. One simulator container per protocol;
# each speaks Ward-Beck crosspoint lines to the caster on its Ward-Beck port
# and takes a second copy of every line from the MQTT broker; a line is
# applied only when both copies agree.
# Re-run the command when manuals are added, then `docker compose up -d`.

services:
  sim-2-wire:
    image: trunk-caster-frame-sim:latest
    container_name: sim-2-wire
    hostname: sim-2-wire
    restart: unless-stopped
    depends_on:
      - trunk-caster
      - frame-sim-image
      - mqtt
    environment:
      SIM_PROTOCOL: 2-wire
      SIM_NAME: sim-2-wire
      SIM_SITE: ${TRUNK_SITE:-HQ}
      SIM_CASTER: trunk-caster:7879
      SIM_CHECKIN_SECONDS: "20"
      SIM_MQTT: mqtt:1883
    profiles: ["sims"]

  sim-4-wire:
    image: trunk-caster-frame-sim:latest
